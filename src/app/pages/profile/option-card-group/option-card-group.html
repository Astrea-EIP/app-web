<div
  class="group"
  role="radiogroup"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="invalid() ? errorId() : null"
>
  @for (option of options(); track option.value) {
    <label
      class="card"
      [class.card--selected]="value() === option.value"
      [class.card--with-icon]="option.icon"
    >
      <input
        class="card__input"
        type="radio"
        [name]="name"
        [value]="option.value"
        [checked]="value() === option.value"
        [disabled]="isDisabled()"
        (change)="select(option.value)"
        (blur)="touched()"
      />
      @if (option.icon) {
        <span class="card__tile" aria-hidden="true">
          <svg
            viewBox="0 0 16 16"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            focusable="false"
          >
            @switch (option.icon) {
              @case ('wheelchair') {
                <circle cx="6" cy="2.5" r="1.3" />
                <path d="M6 4.5v4.5h4l1.5 4M6 7h3.5" />
                <circle cx="5.5" cy="11" r="3" />
              }
              @case ('bolt') {
                <path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z" />
              }
              @case ('cane') {
                <circle cx="7" cy="2.5" r="1.3" />
                <path d="M7 4.5v4.5M7 9l-2 5M7 9l2 5M4.5 6.5h5M12 6.5V14" />
              }
              @case ('person') {
                <circle cx="8" cy="2.5" r="1.3" />
                <path d="M8 4.5v5M8 9.5l-2.5 4.5M8 9.5l2.5 4.5M4.5 6.5h7" />
              }
              @case ('cart') {
                <path d="M1.5 2h2l1.5 7.5h7l1.5-5.5H4" />
                <circle cx="6" cy="12.5" r="1" />
                <circle cx="11" cy="12.5" r="1" />
              }
              @case ('eye') {
                <path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8z" />
                <circle cx="8" cy="8" r="2" />
              }
            }
          </svg>
        </span>
      }
      <span class="card__texts">
        <span class="card__label">{{ option.label }}</span>
        <span class="card__description">{{ option.description }}</span>
      </span>
      @if (option.icon) {
        <span class="card__radio" aria-hidden="true"></span>
      }
    </label>
  }
</div>
